<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ Mã Hóa & Giải Mã HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        .button-group {
            margin: 15px 0;
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-encode {
            background-color: #2ecc71;
            color: white;
        }
        .btn-encode:hover {
            background-color: #27ae60;
        }
        .btn-decode {
            background-color: #3498db;
            color: white;
        }
        .btn-decode:hover {
            background-color: #2980b9;
        }
        .btn-clear {
            background-color: #95a5a6;
            color: white;
            flex: 0.5;
        }
        .btn-clear:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mã Hóa & Giải Mã HTML</h2>
    
    <label for="inputOutput">Nhập đoạn code của bạn vào đây:</label>
    <textarea id="inputOutput" placeholder="Ví dụ mã hóa: <h1>Hello</h1>&#10;Ví dụ giải mã: &lt;h1&gt;Hello&lt;/h1&gt;"></textarea>
    
    <div class="button-group">
        <button class="btn-encode" onclick="handleEncode()">Mã hóa (Encode)</button>
        <button class="btn-decode" onclick="handleDecode()">Giải mã (Decode)</button>
        <button class="btn-clear" onclick="handleClear()">Xóa hết</button>
    </div>
</div>

<script>
    // Hàm mã hóa HTML Entities
    function htmlEncode(str) {
        return str.replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;")
                  .replace(/'/g, "&#039;");
    }

    // Hàm giải mã HTML Entities sử dụng DOM ẩn (an toàn và chuẩn xác)
    function htmlDecode(str) {
        const doc = new DOMParser().parseFromString(str, "text/html");
        return doc.documentElement.textContent;
    }

    // Xử lý khi nhấn nút Mã Hóa
    function handleEncode() {
        const textarea = document.getElementById('inputOutput');
        textarea.value = htmlEncode(textarea.value);
    }

    // Xử lý khi nhấn nút Giải Mã
    function handleDecode() {
        const textarea = document.getElementById('inputOutput');
        textarea.value = htmlDecode(textarea.value);
    }

    // Xử lý khi nhấn nút Xóa
    function handleClear() {
        document.getElementById('inputOutput').value = '';
    }
</script>

</body>
</html>
